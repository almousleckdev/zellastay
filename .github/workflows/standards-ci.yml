name: standards-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: standards-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scanner unit tests
        run: python3 -I -m unittest discover -s infra/scripts -t infra/scripts
      - name: Frontend standards scan
        run: python3 -I infra/scripts/check_standards.py
