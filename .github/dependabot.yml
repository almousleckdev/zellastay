version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # The Java version is a project decision (ADR-21, Java 21 toolchain), not an automatic update.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
