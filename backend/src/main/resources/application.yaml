spring:
  application:
    name: zellastay
  config:
    import: "optional:configtree:${ZS_SECRETS_DIR:/run/secrets/}"
  datasource:
    url: ${ZS_DB_URL}
    username: ${ZS_DB_USER}
    password: ${ZS_DB_PASSWORD}
  data:
    redis:
      host: ${ZS_REDIS_HOST}
      port: ${ZS_REDIS_PORT:6379}
      password: ${ZS_REDIS_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
      completion-mode: update

  messages:
    basename: messages/errors
    fallback-to-system-locale: false
  web:
    locale: fr

zellastay:
  environment: ${ZS_ENVIRONMENT}
  rate-limit:
    auth: { requests: 20, window: 1m }
    api: { requests: 600, window: 1m }
  audit:
    partitions-ahead: 3
    maintenance-cron: "0 15 3 * * *"
  identity:
    tokens:
      issuer: zellastay-${ZS_ENVIRONMENT}
      signing-key-id: ${ZS_IDENTITY_TOKEN_SIGNING_KEY_ID:}
      signing-key: ${ZS_IDENTITY_TOKEN_SIGNING_KEY:}
      access-ttl: 15m
      refresh-reuse-grace: 10s
      session-cache-ttl: 30s
      sessions:
        customer: { absolute: 30d, idle: 14d }
        vendor: { absolute: 14d, idle: 3d }
        admin: { absolute: 12h, idle: 30m }
    lockout:
      threshold: 5
      base-duration: 1m
      max-duration: 1h
    mfa:
      encryption-key-id: ${ZS_IDENTITY_MFA_ENCRYPTION_KEY_ID:}
      encryption-key: ${ZS_IDENTITY_MFA_ENCRYPTION_KEY:}
      ticket-ttl: 5m
      max-attempts: 5
      issuer-label: Zella Stay
    bootstrap:
      enabled: ${ZS_IDENTITY_BOOTSTRAP_ENABLED:false}
      email: ${ZS_IDENTITY_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${ZS_IDENTITY_BOOTSTRAP_ADMIN_PASSWORD:}
    hashing:
      memory-kib: 19456
      iterations: 2
      parallelism: 1
    challenges:
      code-ttl: 10m
      max-attempts: 5
      resend-cooldown: 60s
      max-sends-per-hour: 5
      reset-token-ttl: 30m
      pepper: ${ZS_IDENTITY_CHALLENGE_PEPPER:}

server:
  port: ${ZS_SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  server:
    port: ${ZS_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: never
  metrics:
    tags:
      application: zellastay
      environment: ${ZS_ENVIRONMENT}

logging:
  structured:
    format:
      console: ecs
